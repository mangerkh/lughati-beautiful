<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ركّبي المقاطع - عا / غا</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:#33251f;
  background:linear-gradient(#84d5ff 0 36%,#dff7ff 36% 50%,#9ddd6b 50% 72%,#f2ce83 72%);
}
.game{max-width:980px;margin:auto;padding:14px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:17px;padding:10px 16px;font-weight:900;color:white;cursor:pointer;box-shadow:0 5px 0 #0002}
.back{background:#168bd2}.retry{background:#168bd2}.sound{background:#6b7280}
.status{background:#864817;color:#fff;border:3px solid #fff1d1;border-radius:17px;padding:8px 13px;font-weight:900}
.title{
  width:max-content;max-width:94%;margin:14px auto 8px;padding:10px 34px;
  background:linear-gradient(#ffe99e,#f5ba57);border:4px solid #99541d;border-radius:20px;
  font-size:31px;font-weight:900;box-shadow:0 6px 0 #7b3e13
}
.instruction{
  max-width:820px;margin:0 auto 18px;background:#fff5dc;border:3px solid #efc27b;
  border-radius:20px;padding:12px 18px;text-align:center;font-size:18px;font-weight:800;line-height:1.8
}
.board{
  max-width:860px;margin:auto;background:rgba(255,255,255,.94);border:3px solid #efbd77;border-radius:26px;
  padding:20px;box-shadow:0 14px 35px #0002
}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;direction:rtl}
.zone{
  min-height:330px;border-radius:24px;padding:16px;border:4px solid transparent;
  transition:.18s transform,.18s box-shadow,.18s background
}
.zone-a{background:#fff2ea;border-color:#ff8b58}
.zone-b{background:#eafaf0;border-color:#55c881}
.zone.dragover{transform:scale(1.02);box-shadow:0 0 0 7px #ffd84b55}
.base{
  width:120px;height:90px;margin:0 auto 12px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-size:48px;font-weight:900;color:#fff;box-shadow:0 7px 0 #0002
}
.zone-a .base{background:linear-gradient(#ff8d46,#f05d14)}
.zone-b .base{background:linear-gradient(#45ca7b,#159e53)}
.zone h3{text-align:center;margin:4px 0 14px;font-size:20px}
.droparea{
  min-height:170px;border:3px dashed #c9a77a;border-radius:20px;background:#ffffffaa;
  padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:10px
}
.word-result{
  background:#fff;border-radius:14px;padding:9px 14px;font-size:23px;font-weight:900;
  box-shadow:0 4px 0 #0002;border:2px solid #ddd
}
.zone-a .word-result{color:#b64d12;border-color:#ffc39f}
.zone-b .word-result{color:#18733e;border-color:#9ce2b9}
.pieces-title{text-align:center;margin:22px 0 10px;font-weight:900;color:#5c4335}
.pieces{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.piece{
  min-width:105px;background:linear-gradient(#fffdf7,#f7ddb4);border:3px solid #e9a45b;border-radius:18px;
  padding:13px 18px;font-size:30px;font-weight:900;cursor:grab;user-select:none;touch-action:none;
  box-shadow:0 6px 0 #b97935;transition:.15s transform,.15s opacity
}
.piece:hover{transform:translateY(-3px)}
.piece.selected{outline:6px solid #48aaff;transform:scale(1.05)}
.piece.used{opacity:.22;pointer-events:none}
.piece.bad{animation:shake .36s;background:#ffdede;border-color:#e33}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(24px);opacity:0;
  background:#2c2c2c;color:#fff;padding:11px 18px;border-radius:18px;transition:.22s;z-index:50
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.overlay.show{display:flex}
.modal{width:min(500px,96vw);background:#fffdf7;border-radius:28px;padding:28px;text-align:center;border:4px solid #ffd86b}
.modal h2{font-size:32px;margin:0 0 8px}.stars{font-size:48px}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:70;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(760deg);opacity:.2}}
@media(max-width:650px){
  .title{font-size:25px;padding:8px 22px}.instruction{font-size:15px}.board{padding:13px}
  .columns{gap:10px}.zone{padding:10px;min-height:285px}.base{width:88px;height:72px;font-size:38px}
  .droparea{min-height:145px}.piece{min-width:85px;font-size:25px;padding:11px 13px}
  .word-result{font-size:18px;padding:7px 10px}
}
</style>
</head>
<body>
<div class="game">
  <div class="top">
    <button class="btn back" onclick="goBack()">🏠 العودة للدرس</button>
    <div class="status">⭐ النقاط: <span id="score">0</span> | <span id="progress">0/6</span></div>
  </div>

  <div class="title">ركّبي المقاطع</div>
  <div class="instruction">
    اسحبي كل مقطع إلى الحرف المناسب لتكوّني كلمات صحيحة.
  </div>

  <div class="board">
    <div class="columns">
      <div class="zone zone-a" id="zoneA" data-target="A">
        <div class="base">عا</div>
        <h3>مقاطع تبدأ بـ «عا»</h3>
        <div class="droparea" id="dropA"></div>
      </div>

      <div class="zone zone-b" id="zoneB" data-target="B">
        <div class="base">غا</div>
        <h3>مقاطع تبدأ بـ «غا»</h3>
        <div class="droparea" id="dropB"></div>
      </div>
    </div>

    <div class="pieces-title">المقاطع</div>
    <div class="pieces" id="pieces"></div>

    <div class="controls">
      <button class="btn retry" onclick="resetGame()">↻ إعادة المحاولة</button>
      <button class="btn sound" id="soundBtn" onclick="toggleSound()">🔊 الأصوات مفعلة</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>أحسنتِ يا بطلة! 🎉</h2>
    <div class="stars">⭐⭐⭐</div>
    <p id="finalText"></p>
    <div class="controls">
      <button class="btn retry" onclick="resetGame()">إعادة اللعب</button>
      <button class="btn back" onclick="goBack()">العودة للدرس</button>
    </div>
  </div>
</div>

<script>
const PIECES = [
  {piece:"دل",target:"A",word:"عادل"},
  {piece:"صم",target:"A",word:"عاصم"},
  {piece:"مل",target:"A",word:"عامل"},
  {piece:"ئم",target:"B",word:"غائم"},
  {piece:"ئب",target:"B",word:"غائب"},
  {piece:"لب",target:"B",word:"غالب"}
];

let score=0,done=0,soundOn=true,selectedIndex=null;

const $=id=>document.getElementById(id);

function initPieces(){
  $("pieces").innerHTML="";
  $("dropA").innerHTML="";
  $("dropB").innerHTML="";
  score=0;done=0;selectedIndex=null;
  updateStatus();

  [...PIECES].map((x,i)=>({...x,i})).sort(()=>Math.random()-.5).forEach(item=>{
    const el=document.createElement("div");
    el.className="piece";
    el.textContent=item.piece;
    el.draggable=true;
    el.dataset.i=item.i;

    el.onclick=()=>{
      if(el.classList.contains("used"))return;
      document.querySelectorAll(".piece").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");
      selectedIndex=item.i;
      speak(item.piece);
    };

    el.ondragstart=e=>{
      if(el.classList.contains("used")){e.preventDefault();return;}
      e.dataTransfer.setData("text/plain",item.i);
      selectedIndex=item.i;
    };

    $("pieces").appendChild(el);
  });
}

function setupZone(id,target){
  const zone=$(id);
  zone.ondragover=e=>{e.preventDefault();zone.classList.add("dragover")};
  zone.ondragleave=()=>zone.classList.remove("dragover");
  zone.ondrop=e=>{
    e.preventDefault();
    zone.classList.remove("dragover");
    const i=parseInt(e.dataTransfer.getData("text/plain"));
    if(!Number.isNaN(i)) place(i,target);
  };
  zone.onclick=()=>{
    if(selectedIndex!==null) place(selectedIndex,target);
  };
}

function place(i,target){
  const item=PIECES[i];
  const el=document.querySelector(`.piece[data-i="${i}"]`);
  if(!el || el.classList.contains("used"))return;

  if(item.target===target){
    el.classList.add("used");
    el.classList.remove("selected");
    score+=10;done++;
    const out=document.createElement("div");
    out.className="word-result";
    out.textContent=item.word;
    $(target==="A"?"dropA":"dropB").appendChild(out);
    successSound();
    showToast(`أحسنتِ 🌟 ${item.word}`);
    updateStatus();
    selectedIndex=null;
    if(done===PIECES.length){
      setTimeout(finishGame,500);
    }
  }else{
    el.classList.add("bad");
    errorSound();
    showToast("ليست هنا، جرّبي الحرف الآخر");
    setTimeout(()=>el.classList.remove("bad"),500);
  }
}

function updateStatus(){
  $("score").textContent=score;
  $("progress").textContent=`${done}/${PIECES.length}`;
}

function resetGame(){
  $("overlay").classList.remove("show");
  initPieces();
}

function finishGame(){
  $("finalText").textContent=`رائع! كوّنتِ الكلمات الست وحصلتِ على ${score} نقطة.`;
  $("overlay").classList.add("show");
  confetti();successSound();
}

function toggleSound(){
  soundOn=!soundOn;
  $("soundBtn").textContent=soundOn?"🔊 الأصوات مفعلة":"🔇 الأصوات متوقفة";
}

function speak(t){
  if(!soundOn||!("speechSynthesis"in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="ar-SA";u.rate=.82;
  speechSynthesis.speak(u);
}

function tone(f,d=.09,type="sine"){
  if(!soundOn)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=f;o.type=type;g.gain.value=.07;o.connect(g);g.connect(c.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.stop(c.currentTime+d);
  }catch(e){}
}
function successSound(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.1),i*85))}
function errorSound(){tone(175,.16,"sawtooth")}

function confetti(){
  for(let i=0;i<65;i++){
    setTimeout(()=>{
      const c=document.createElement("i");
      c.className="confetti";
      c.style.left=Math.random()*100+"vw";
      c.style.background=["#f44336","#ffca28","#4caf50","#2196f3","#9c27b0"][Math.floor(Math.random()*5)];
      c.style.animationDuration=(1.4+Math.random()*1.7)+"s";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3400);
    },i*18);
  }
}

function showToast(t){
  const x=$("toast");
  x.textContent=t;
  x.classList.add("show");
  clearTimeout(x._t);
  x._t=setTimeout(()=>x.classList.remove("show"),1800);
}
function goBack(){
  if(window.history.length>1) history.back();
  else window.location.href = '/lesson/4/practice/games';
}

setupZone("zoneA","A");
setupZone("zoneB","B");
initPieces();
</script>
</body>
</html>
