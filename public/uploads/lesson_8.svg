<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg8)"/>
  <!-- Green Meadow -->
  <path d="M-10 210 Q190 170 410 210 L410 300 L-10 300 Z" fill="#10b981" opacity="0.4"/>
  <path d="M-10 240 Q190 200 410 240 L410 300 L-10 300 Z" fill="#059669" opacity="0.6"/>
  <!-- Cute Fluffy Sheep -->
  <g transform="translate(60, 100)">
    <!-- Legs -->
    <rect x="25" y="80" width="10" height="40" fill="#1e293b" rx="4"/>
    <rect x="45" y="80" width="10" height="40" fill="#1e293b" rx="4"/>
    <rect x="75" y="80" width="10" height="40" fill="#1e293b" rx="4"/>
    <rect x="95" y="80" width="10" height="40" fill="#1e293b" rx="4"/>
    <!-- Wool Clouds Body -->
    <circle cx="40" cy="50" r="25" fill="#ffffff"/>
    <circle cx="65" cy="40" r="30" fill="#ffffff"/>
    <circle cx="90" cy="50" r="25" fill="#ffffff"/>
    <circle cx="70" cy="65" r="25" fill="#ffffff"/>
    <circle cx="45" cy="65" r="22" fill="#ffffff"/>
    <!-- Head -->
    <ellipse cx="25" cy="45" rx="16" ry="12" fill="#1e293b"/>
    <!-- Ear -->
    <ellipse cx="32" cy="38" rx="10" ry="5" fill="#334155" transform="rotate(20 32 38)"/>
    <!-- Eye -->
    <circle cx="20" cy="42" r="3" fill="#ffffff"/>
    <circle cx="19" cy="42" r="1.5" fill="#000000"/>
  </g>
  <!-- Friendly Cute Wolf -->
  <g transform="translate(240, 100)">
    <!-- Legs -->
    <rect x="25" y="85" width="10" height="40" fill="#475569" rx="4"/>
    <rect x="45" y="85" width="10" height="40" fill="#475569" rx="4"/>
    <rect x="75" y="85" width="10" height="40" fill="#475569" rx="4"/>
    <rect x="95" y="85" width="10" height="40" fill="#475569" rx="4"/>
    <!-- Body -->
    <ellipse cx="65" cy="60" rx="40" ry="25" fill="#64748b"/>
    <!-- Head -->
    <polygon points="25,50 5,40 15,65" fill="#475569"/>
    <circle cx="35" cy="45" r="18" fill="#64748b"/>
    <!-- Ears -->
    <polygon points="30,28 42,10 45,30" fill="#475569"/>
    <!-- Eye & Nose -->
    <circle cx="28" cy="40" r="3" fill="#ffffff"/>
    <circle cx="27" cy="40" r="1.5" fill="#000000"/>
    <circle cx="5" cy="40" r="3" fill="#000000"/>
    <!-- Tail -->
    <path d="M105 60 Q130 40 120 80" stroke="#475569" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Flowers & Sparkles -->
  <text x="40" y="70" font-size="32">🌸</text>
  <text x="180" y="80" font-size="28">✨</text>
  <text x="330" y="60" font-size="28">🌳</text>
  <text x="190" y="240" font-size="28">🌼</text>
</svg>
