<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg7)"/>
  <!-- Street & Crosswalk -->
  <rect x="0" y="190" width="400" height="110" fill="#334155"/>
  <line x1="0" y1="245" x2="400" y2="245" stroke="#fde047" stroke-width="6" stroke-dasharray="25 15"/>
  <!-- Zebra Crosswalk -->
  <rect x="180" y="190" width="20" height="110" fill="#ffffff"/>
  <rect x="220" y="190" width="20" height="110" fill="#ffffff"/>
  <!-- Traffic Light Post -->
  <rect x="80" y="40" width="16" height="170" fill="#475569" rx="4"/>
  <rect x="60" y="30" width="56" height="115" fill="#1e293b" rx="14" stroke="#64748b" stroke-width="4"/>
  <!-- Traffic Lights -->
  <circle cx="88" cy="52" r="14" fill="#ef4444"/> <!-- Red -->
  <circle cx="88" cy="87" r="14" fill="#fef08a" opacity="0.4"/> <!-- Yellow -->
  <circle cx="88" cy="122" r="14" fill="#10b981"/> <!-- Green -->
  <!-- Cute Red Car -->
  <g transform="translate(250, 180)">
    <!-- Wheels -->
    <circle cx="25" cy="50" r="16" fill="#0f172a"/>
    <circle cx="25" cy="50" r="7" fill="#cbd5e1"/>
    <circle cx="95" cy="50" r="16" fill="#0f172a"/>
    <circle cx="95" cy="50" r="7" fill="#cbd5e1"/>
    <!-- Car Body -->
    <path d="M0 35 Q10 15 35 15 L75 15 Q105 15 115 35 L120 50 L-5 50 Z" fill="#ef4444" rx="10"/>
    <!-- Window -->
    <path d="M30 18 L55 18 L55 35 L15 35 Z" fill="#e0f2fe"/>
    <path d="M60 18 L85 18 L95 35 L60 35 Z" fill="#e0f2fe"/>
    <!-- Headlight -->
    <circle cx="-2" cy="40" r="5" fill="#fde047"/>
  </g>
  <!-- Stop Sign & Emojis -->
  <g transform="translate(300, 50)">
    <polygon points="25,0 50,0 70,20 70,45 50,65 25,65 5,45 5,20" fill="#dc2626"/>
    <text x="18" y="42" font-size="18" fill="#ffffff" font-weight="900">STOP</text>
    <rect x="35" y="65" width="6" height="60" fill="#64748b"/>
  </g>
  <text x="20" y="80" font-size="32">🚦</text>
  <text x="140" y="100" font-size="32">✨</text>
</svg>
