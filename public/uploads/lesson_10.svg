<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="mane" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg10)"/>
  <!-- Jungle Bush -->
  <path d="M-20 300 Q80 180 180 250 Q280 170 420 220 L420 300 Z" fill="#10b981" opacity="0.6"/>
  <!-- Friendly Big Lion -->
  <g transform="translate(100, 50)">
    <!-- Big Mane -->
    <circle cx="90" cy="90" r="70" fill="url(#mane)"/>
    <!-- Face -->
    <circle cx="90" cy="90" r="48" fill="#fde68a"/>
    <!-- Ears -->
    <circle cx="50" cy="55" r="14" fill="#f59e0b"/>
    <circle cx="130" cy="55" r="14" fill="#f59e0b"/>
    <!-- Eyes -->
    <circle cx="75" cy="80" r="6" fill="#000000"/>
    <circle cx="105" cy="80" r="6" fill="#000000"/>
    <circle cx="73" cy="78" r="2" fill="#ffffff"/>
    <circle cx="103" cy="78" r="2" fill="#ffffff"/>
    <!-- Snout & Nose -->
    <polygon points="90,92 82,104 98,104" fill="#78350f"/>
    <path d="M82 108 Q90 118 98 108" stroke="#78350f" stroke-width="3" fill="none"/>
    <!-- Whiskers -->
    <line x1="50" y1="95" x2="70" y2="98" stroke="#78350f" stroke-width="2"/>
    <line x1="110" y1="98" x2="130" y2="95" stroke="#78350f" stroke-width="2"/>
    <!-- Body -->
    <path d="M50 145 Q90 135 130 145 L140 210 L40 210 Z" fill="#f59e0b"/>
  </g>
  <!-- Tiny Cute Mouse -->
  <g transform="translate(290, 180)">
    <!-- Ears -->
    <circle cx="15" cy="20" r="12" fill="#f472b6"/>
    <circle cx="35" cy="20" r="12" fill="#f472b6"/>
    <!-- Body & Head -->
    <ellipse cx="25" cy="40" rx="22" ry="18" fill="#94a3b8"/>
    <!-- Nose -->
    <circle cx="5" cy="42" r="3" fill="#ef4444"/>
    <!-- Eye -->
    <circle cx="18" cy="35" r="3" fill="#000000"/>
    <!-- Tail -->
    <path d="M45 45 Q65 40 60 65" stroke="#f472b6" stroke-width="3" fill="none"/>
  </g>
  <!-- Crown & Sparkles -->
  <text x="175" y="45" font-size="32">👑</text>
  <text x="40" y="80" font-size="32">🌿</text>
  <text x="330" y="80" font-size="32">✨</text>
</svg>
