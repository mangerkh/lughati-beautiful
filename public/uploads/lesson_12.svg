<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg12)"/>
  <!-- Green Hill & Plants -->
  <path d="M-10 220 Q190 170 410 220 L410 300 L-10 300 Z" fill="#34d399" opacity="0.5"/>
  <!-- Girl 1 Researcher -->
  <g transform="translate(70, 70)">
    <!-- Hair Ponytail -->
    <circle cx="35" cy="40" r="30" fill="#78350f"/>
    <circle cx="15" cy="35" r="14" fill="#78350f"/>
    <circle cx="55" cy="35" r="14" fill="#78350f"/>
    <!-- Face -->
    <circle cx="35" cy="50" r="22" fill="#fde68a"/>
    <circle cx="28" cy="48" r="3" fill="#000000"/>
    <circle cx="42" cy="48" r="3" fill="#000000"/>
    <path d="M28 60 Q35 68 42 60" stroke="#ef4444" stroke-width="2" fill="none"/>
    <!-- Dress -->
    <path d="M10 72 L60 72 L70 150 L0 150 Z" fill="#ec4899"/>
  </g>
  <!-- Girl 2 Researcher -->
  <g transform="translate(230, 80)">
    <!-- Hair -->
    <path d="M10 20 Q35 0 60 20 L65 70 Q35 60 5 70 Z" fill="#451a03"/>
    <!-- Face -->
    <circle cx="35" cy="45" r="20" fill="#fde68a"/>
    <circle cx="28" cy="43" r="3" fill="#000000"/>
    <circle cx="42" cy="43" r="3" fill="#000000"/>
    <path d="M28 54 Q35 62 42 54" stroke="#ef4444" stroke-width="2" fill="none"/>
    <!-- Dress -->
    <path d="M10 65 L60 65 L70 140 L0 140 Z" fill="#a855f7"/>
  </g>
  <!-- Big Magnifying Glass in Center -->
  <g transform="translate(160, 110)">
    <circle cx="40" cy="40" r="35" fill="#e0f2fe" opacity="0.7" stroke="#0284c7" stroke-width="6"/>
    <line x1="65" y1="65" x2="100" y2="100" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
    <text x="25" y="48" font-size="28">🔍</text>
  </g>
  <!-- Discoveries: Butterfly, Flower, Star, Book -->
  <text x="40" y="70" font-size="32">🦋</text>
  <text x="320" y="80" font-size="32">🌺</text>
  <text x="330" y="240" font-size="32">🔬</text>
  <text x="50" y="230" font-size="32">📚</text>
  <text x="200" y="60" font-size="28">⭐</text>
</svg>
