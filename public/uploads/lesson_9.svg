<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg9)"/>
  <!-- Little Doctor Girl -->
  <g transform="translate(140, 40)">
    <!-- Hair -->
    <ellipse cx="60" cy="50" rx="45" ry="40" fill="#78350f"/>
    <!-- Head -->
    <circle cx="60" cy="65" r="30" fill="#fde68a"/>
    <!-- Headband / Doctor Cap -->
    <path d="M30 50 Q60 30 90 50 L90 58 Q60 40 30 58 Z" fill="#38bdf8"/>
    <!-- Red Cross on Cap -->
    <rect x="56" y="38" width="8" height="18" fill="#ef4444"/>
    <rect x="51" y="43" width="18" height="8" fill="#ef4444"/>
    <!-- Eyes -->
    <circle cx="48" cy="65" r="4" fill="#000000"/>
    <circle cx="72" cy="65" r="4" fill="#000000"/>
    <!-- Smile -->
    <path d="M48 78 Q60 88 72 78" stroke="#ef4444" stroke-width="3" fill="none"/>
    <!-- White Doctor Coat -->
    <path d="M20 95 L100 95 L115 210 L5 210 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="50" y="95" width="20" height="115" fill="#fce7f3"/>
    <!-- Stethoscope around neck -->
    <path d="M35 95 Q30 130 60 140 Q90 130 85 95" fill="none" stroke="#475569" stroke-width="4"/>
    <circle cx="60" cy="140" r="10" fill="#f59e0b"/>
  </g>
  <!-- Medical First Aid Kit / Bag -->
  <g transform="translate(270, 160)">
    <rect x="10" y="20" width="70" height="50" fill="#ef4444" rx="10"/>
    <path d="M30 20 L30 10 Q45 0 60 10 L60 20" stroke="#b91c1c" stroke-width="4" fill="none"/>
    <!-- White Cross -->
    <rect x="41" y="30" width="8" height="30" fill="#ffffff"/>
    <rect x="30" y="41" width="30" height="8" fill="#ffffff"/>
  </g>
  <!-- Heart & Sparkles -->
  <text x="50" y="100" font-size="36">❤️</text>
  <text x="60" y="220" font-size="32">🩺</text>
  <text x="310" y="90" font-size="32">✨</text>
  <text x="40" y="180" font-size="32">💊</text>
</svg>
