<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg3)"/>
  <!-- Sun & Clouds -->
  <circle cx="70" cy="70" r="30" fill="#fde047"/>
  <path d="M260 70 Q275 50 295 60 Q315 40 335 60 Q355 55 350 75 Q355 95 330 90 Q305 100 285 90 Q260 90 260 70 Z" fill="#ffffff" opacity="0.9"/>
  <!-- Tree Branch & Nest -->
  <rect x="0" y="180" width="220" height="24" fill="#78350f" rx="8"/>
  <path d="M140 160 Q120 120 70 140 Q40 180 80 180 Z" fill="#10b981"/>
  <!-- Nest -->
  <ellipse cx="140" cy="180" rx="40" ry="20" fill="#d97706" stroke="#92400e" stroke-width="4"/>
  <ellipse cx="140" cy="175" rx="30" ry="12" fill="#78350f"/>
  <!-- Eggs in Nest -->
  <ellipse cx="130" cy="172" rx="8" ry="10" fill="#ffffff"/>
  <ellipse cx="145" cy="170" rx="8" ry="10" fill="#ffffff"/>
  <ellipse cx="152" cy="175" rx="7" ry="9" fill="#ffffff"/>
  <!-- Flying Bird returning -->
  <g transform="translate(240, 110)">
    <!-- Wings -->
    <path d="M0 0 Q20 -30 40 -10 Q20 0 0 0 Z" fill="#38bdf8"/>
    <path d="M0 0 Q-10 -35 15 -25 Q10 0 0 0 Z" fill="#0284c7"/>
    <!-- Body -->
    <ellipse cx="10" cy="10" rx="25" ry="16" fill="#0284c7"/>
    <!-- Head -->
    <circle cx="-10" cy="2" r="14" fill="#38bdf8"/>
    <!-- Eye -->
    <circle cx="-14" cy="-1" r="3" fill="#ffffff"/>
    <circle cx="-15" cy="-1" r="1.5" fill="#000000"/>
    <!-- Beak -->
    <polygon points="-24,2 -32,-2 -24,8" fill="#f59e0b"/>
    <!-- Tail -->
    <polygon points="30,10 48,0 45,20" fill="#0284c7"/>
  </g>
  <!-- Notes & Flowers -->
  <text x="220" y="70" font-size="28">🎶</text>
  <text x="180" y="130" font-size="24">🎵</text>
  <text x="310" y="230" font-size="32">🌸</text>
  <text x="340" y="250" font-size="32">🌿</text>
</svg>
